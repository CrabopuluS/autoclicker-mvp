name: Build and Release Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name AutoClickerMVP --icon assets/branding/app_icon.ico main.py

      - name: Archive release bundle
        run: |
          Compress-Archive -Path dist\AutoClickerMVP\* -DestinationPath AutoClickerMVP-win64.zip -Force

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: AutoClickerMVP-win64.zip
          body_path: RELEASE_NOTES_v1.0.0.md
