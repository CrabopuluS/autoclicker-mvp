name: Bug Report
description: Report a reproducible problem in AutoClicker MVP.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe expected vs actual behavior.
      placeholder: "Expected ..., but got ..."
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Windows 11 23H2"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open app
        2. Set ...
        3. Press ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Copy messages from in-app event log if possible.
