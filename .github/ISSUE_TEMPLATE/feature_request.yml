name: Feature Request
description: Suggest an improvement for AutoClicker MVP.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What should be added or changed?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Why is this useful?
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional context
